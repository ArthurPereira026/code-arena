<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>inscrição</title>

</head>
<body>

    <h1>Escrição Para Turmas</h1>

    <form action="" class="cartao">
        <label for="name">Nome</label>
        <input type="text" id="nome" placeholder="Digite seu Nome Completo"><br>

        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu E-mail">
        <br>
        <label for="turma">Turma</label>
        <input type="text" id="turma" placeholder="Digite sua turma">
        <br>

        <select name="turno" id="turno" class="selecao">
            <option value="manha">Manhã</option>
            <option value="tarde">tarde</option>
            <option value="noturno">Noturno</option>
        </select>
        <br>

        <select name="cursos" id="cursos" class="selecao">
            <option value="tecnologia">Desenvolvimento de Sistemas</option>
            <option value="tecnologia">Desenvolvimento com IA</option>
            <option value="culinaria">Gastronomia</option>
            <option value="engenharia-mecanica">Engenharia mecanica</option>
        </select>

        <h2>Tabela de Categorias</h2>

        <table border="1" class="tabela">
            <tr>
                <th>Cursos</th>
            </tr>
            <tr>
                <td>Tecnologia</td>
            </tr>
            <tr>
                <td>culinaria</td>
            </tr>
            <tr>
                <td>Engenharia Mecanica</td>
            </tr>
        </table>
        <br>
        <button class="botao">submit</button>

    </form>
    
</body>
</html>
